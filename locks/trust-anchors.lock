# Extra TLS trust anchors of res/xml/network_security_config.xml (roadmap P5.1, Android 7.0 model downloads), checked by
# app/build.gradle.kts during configuration and by TrustAnchorsTest. GitHub serves the model catalog
# (raw.githubusercontent.com) and the release assets (objects / release-assets.githubusercontent.com) with a Let's Encrypt
# chain that ends at ISRG Root X1 (checked with openssl s_client on 2026-10-29: leaf, YR1, Root YR, ISRG Root X1), which the
# system store of Android 7.0 (API 24) lacks and 7.1.1 carries. The anchor is added next to the system store, never instead.
# isrg-root-x1: the self-signed ISRG Root X1 certificate (RSA 4096, valid 2015-06-04 to 2035-06-04) as Let's Encrypt
#   publishes it in DER form; the SHA-256 of the DER bytes is the certificate's SHA-256 fingerprint. Downloaded on
#   2026-10-29, kept byte for byte. Certificates are not licensed works; the file carries no license of its own.
format=1
isrg-root-x1.path=app/src/main/res/raw/isrg_root_x1.der
isrg-root-x1.sha256=96bcec06264976f37460779acf28c5a7cfe8a3c0aae11a8ffcee05c0bddf08c6
isrg-root-x1.url=https://letsencrypt.org/certs/isrgrootx1.der
isrg-root-x1.subject=CN=ISRG Root X1,O=Internet Security Research Group,C=US
isrg-root-x1.notAfter=2035-06-04T11:04:38Z
