# Corresponding source of libsherpa-onnx-jni.so (roadmap D32, P6.4; GPL-3.0 section 6(d)): every GitHub Release of the
# plugin attaches the archive below next to its APKs and lists it in SHA256SUMS. Build and check it with
#   py -I .python/corresponding_source.py build --downloads <dir outside the repository>
# Redo it when the sherpa-onnx AAR changes (locks/sherpa-onnx.lock).
# Dependencies: the URL and SHA-256 that the cmake files of sherpa-onnx v1.13.8 pin (kaldifst: the cmake/ of
#   kaldi-decoder v0.3.0, which sherpa-onnx builds with add_subdirectory and whose include(kaldifst) is the only module
#   that sherpa-onnx's own cmake/ does not provide); the archive keeps the file names that the cmake files look for in
#   ~/Downloads. These are the eleven components of THIRD_PARTY_NOTICES.md ("Statically linked", UCD Tools is part of
#   the eSpeak NG tree). Not included: ONNX Runtime (a separate prebuilt MIT library) and the cmake modules that the
#   Android build does not use (googletest, pybind11, portaudio, websocketpp, asio, cargs).
# sherpa-onnx: upstream pins no digest for its own source, so the SHA-256 of the GitHub archive of tag v1.13.8 was
#   measured on 2026-10-20 and the tool also checks the commit that GitHub records in the archive's pax header.
