name: Build integrity

on:
  push:
  pull_request:
  # A manual run with full-suite also runs every test class on the API 37.1 entry (to check a newer image).
  workflow_dispatch:
    inputs:
      full-suite:
        description: "Run every test class on API 37.1 too"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    name: Repository checks, unit tests and APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # check_repository.py compares VERSION_BUILD with the full commit count.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify the repository contract, generated documents and the native ABI report
        run: |
          python .python/check_repository.py
          python .python/generate_markdown.py --check
          python .python/verify_native_alignment.py --check
          python -m unittest discover -s .python/tests -p "test_*.py"

      - name: Run unit tests, assemble APKs and lint
        run: |
          chmod +x gradlew
          # The release APKs are built explicitly: R8 and resource shrinking failures only surface there.
          # They stay unsigned on CI; the signed release gate (verifySignedReleaseArtifacts) and the release probe run locally.
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintDebug -Pautojs.gradle.build.number.auto.increment.enabled=false -Pautojs.gradle.build.time.update.enabled=false --console=plain --stacktrace

      - name: Check native packaging of every release split
        run: python .python/verify_native_alignment.py --check --expect-compressed --apk app/build/outputs/apk/release/*.apk

      - name: Upload debug, release and test APKs
        uses: actions/upload-artifact@v7
        with:
          name: three-macaw-speech-apks
          path: app/build/outputs/apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload test and lint reports after failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  verify-contract:
    name: Contract and runtime (API ${{ matrix.api-level }}, ${{ matrix.arch }}, ${{ matrix.page-size }} B pages)
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 24
            arch: x86
            target: google_apis
            profile: Nexus 5
            page-size: 4096
          - api-level: 35
            arch: x86_64
            target: google_apis
            profile: pixel_7
            page-size: 4096
          # 16 KB pages (roadmap D14 / P0.3): the sherpa-onnx and onnxruntime libraries must load and run the VAD.
          - api-level: 35
            arch: x86_64
            target: google_apis_ps16k
            profile: pixel_7
            page-size: 16384
            ram-size: 4096M
          # Android 17 only ships the 16 KB image. On the GitHub runner its surfaceflinger aborts in the image's gralloc
          # mapper ("Assertion failed: !rcEnc->featureInfo()->hasReadColorBufferDma") each time the launcher samples the
          # gesture navigation handle, and system_server restarts with it about every 25 seconds: run 39360787126 installed
          # the APKs while user 0 was still locked, so the plugin's own components and data directory were missing (roadmap
          # P0.3). Three-button navigation stops the sampling; 3-Stove Agent saw system_server abort on the same assertion
          # when it copies the task snapshot of a finishing activity (gpu guest and -feature -GLDMA alike), so this entry
          # runs only the test classes that open no window and stays non-blocking until the image is fixed.
          - api-level: 37.1
            arch: x86_64
            target: google_apis_ps16k
            profile: pixel_7
            page-size: 16384
            ram-size: 4096M
            disk-size: 4096M
            suite-args: --three-button-navigation
            window-free-classes: ThreeMacawSpeechContractTest,SherpaRuntimeDeviceTest,SpeechSynthesisDeviceTest,AudioDecodeDeviceTest,M4aWriterDeviceTest,SpeechToolServiceDeviceTest
            experimental: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the activation, discovery, Binder and native runtime tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          ram-size: ${{ matrix.ram-size }}
          disk-size: ${{ matrix.disk-size }}
          avd-name: Three_Macaw_Speech_CI_${{ matrix.api-level }}_${{ matrix.page-size }}
          # Run 39367320469: the runner's own `settings put global animator_duration_scale 0.0` right after the API 37.1
          # boot met a restarting system_server ("Failure calling service settings: Broken pipe") and failed the job before
          # the tests; ci_connected_tests.py turns the animations off (and hides system error dialogs) once settled.
          disable-animations: false
          script: |
            chmod +x gradlew
            # The emulator runner executes every script line as a separate shell command, so a backslash continuation
            # would become a literal Gradle task name; keep each command on one line (3-Block Compose lesson).
            test "${{ matrix.page-size }}" = "4096" || test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = "${{ matrix.page-size }}"
            # The suite runs once more after an emulator failure (system_server errors or restarts, a lost device), and
            # every adb command is time limited: run 39284420735 hung on `adb logcat -d` after the API 37.1 emulator was gone.
            python3 .python/ci_connected_tests.py ${{ matrix.suite-args }} ${{ (matrix.window-free-classes && !inputs.full-suite) && format('--classes {0}', matrix.window-free-classes) || '' }}

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports-api${{ matrix.api-level }}-${{ matrix.page-size }}
          path: |
            app/build/reports/androidTests/
            app/build/reports/androidTests-attempt-1/
            app/build/outputs/androidTest-results/connected/
            app/build/outputs/androidTest-results/connected-attempt-1/
          if-no-files-found: ignore
          retention-days: 7
